name: CI

on:
  pull_request:
    branches:
      - main
      - openmontage
  push:
    branches:
      - main
      - openmontage

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: make install-dev

      - name: Run lint smoke checks
        run: make lint

      - name: Run test suite
        run: make test

  validate-windows:
    name: Validate Windows compatibility
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile project Python
        run: python -m compileall -q lib tools backlot

      - name: Run unit and contract tests
        run: python -m pytest tests/unit/ tests/contracts/ -q
